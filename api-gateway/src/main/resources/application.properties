spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Routes dynamiques via Eureka (lb://NOM-DU-SERVICE)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=emergency-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://EMERGENCY-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/emergencies/**

spring.cloud.gateway.server.webflux.routes[1].id=patient-record-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PATIENT-RECORD-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/patients/**

spring.cloud.gateway.server.webflux.routes[2].id=triage-ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TRIAGE-AI-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/triage/**

spring.cloud.gateway.server.webflux.routes[3].id=hospital-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://HOSPITAL-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/hospitals/**

spring.cloud.gateway.server.webflux.routes[4].id=dispatch-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://DISPATCH-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/dispatch/**

# Sécurité : JWT émis par Keycloak (realm rescuenet). jwk-set-uri évite de contacter Keycloak au démarrage.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/rescuenet
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/rescuenet/protocol/openid-connect/certs

# CORS : géré par SecurityConfig (le filtre de sécurité passe avant le routage)


management.endpoints.web.exposure.include=health,info,gateway
