spring.application.name=emergency-service
server.port=8081

# PostgreSQL (conteneur Docker, port 5433 : 5432 est pris par le PostgreSQL local)
spring.datasource.url=jdbc:postgresql://localhost:5433/emergency_db
spring.datasource.username=rescue
spring.datasource.password=rescue123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rescue
spring.rabbitmq.password=rescue123
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
spring.cloud.loadbalancer.cache.ttl=5s

# Timeouts des appels vers les autres modules
rescuenet.http.connect-timeout=2s
rescuenet.http.read-timeout=6s

management.endpoints.web.exposure.include=health,info
