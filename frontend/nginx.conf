server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Application monopage : toute route inconnue renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
